name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: agripay
          POSTGRES_PASSWORD: agripay
          POSTGRES_DB: agripay_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agripay" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql://agripay:agripay@localhost:5432/agripay_test
      DATABASE_URL_TEST: postgresql://agripay:agripay@localhost:5432/agripay_test
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-1234
      INTERNAL_API_TOKEN: ci-internal-token
      APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to the test database
        run: pnpm db:deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
